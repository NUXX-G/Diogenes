# Diogenes — docker compose
# Fase 0: solo se levanta ollama. El resto de servicios está comentado como
# esqueleto y se activa en su fase (n8n en la 4; tools-mcp y casa-sim en la 5).
#
# Reglas (ver CLAUDE.md y README.md):
#   - Puertos publicados solo en 127.0.0.1.
#   - Imágenes con versión fijada, nunca :latest.
#   - Sin /var/run/docker.sock ni el disco del host montados.

name: diogenes

services:
  ollama:
    # Tag verificado en Docker Hub el 26-10-2026 (última estable).
    image: ollama/ollama:0.40.11
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Madrid}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-8192}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
    volumes:
      - ollama_models:/root/.ollama # pesos de los modelos, fuera del repo
    ports:
      # Solo para las pruebas de las Fases 2 y 3 desde el host.
      # n8n y tools-mcp usan la red interna (http://ollama:11434).
      # En el host se usa 11435 y no 11434 para no chocar con un Ollama nativo
      # de Windows (y no probar contra él por error).
      - "127.0.0.1:${OLLAMA_HOST_PORT:-11435}:11434"
    networks:
      - diogenes
    # qwen3.5:4b en Q8_0 ocupa ~5 GB más el contexto. Pensado para 16 GB de RAM.
    mem_limit: 6g
    healthcheck:
      # La imagen no trae curl; `ollama list` falla si el servidor no responde.
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

