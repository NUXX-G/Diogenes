[project]
name = "diogenes"
version = "0.1.0"
description = "Asistente personal con IA local que controla el PC (modo personal)"
requires-python = ">=3.12,<3.15"
dependencies = [
    "httpx==0.28.1",
    "httpx2==2.16.0",
    "mcp==2.3.0",
    "playwright==1.64.1",
    "python-dotenv==1.2.4",
    "rapidfuzz==3.14.6",
    "uvicorn==0.54.0",
    "winrt-runtime==4.1.0 ; sys_platform == 'win32'",
    "winrt-windows-foundation==4!10.0.28000.2957 ; sys_platform == 'win32'",
    "winrt-windows-foundation-collections==4!10.0.28000.2957 ; sys_platform == 'win32'",
    "winrt-windows-media-control==4!10.0.28000.2957 ; sys_platform == 'win32'",
    "winrt-windows-storage-streams==4!10.0.28000.2957 ; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "ruff==0.17.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
